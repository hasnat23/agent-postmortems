id: AP-0010
title: New York City's official business chatbot advises owners to break the law
date: '2024-03-29'
system: MyCity chatbot (Microsoft Azure AI)
vendor: City of New York
affected: NYC business owners and tenants
classes: [hallucination]
severity: medium
status: in-the-wild
summary: >-
  The Markup found the city's chatbot telling businesses they could take workers' tips, refuse tenants
  with housing vouchers, and fire workers who complained of harassment, all illegal. The city kept it
  online with disclaimers; in January 2026 the incoming mayor moved to shut it down.
root_cause: >-
  A government chatbot gave confident legal answers with no grounding or legal review of outputs.
mitigations:
- For legal or regulatory questions, answer only from cited official text, or decline.
- Red-team with domain experts before launch and monitor for known-wrong answers.
sources:
- title: The Markup
  url: https://themarkup.org/news/2024/03/29/nycs-ai-chatbot-tells-businesses-to-break-the-law
- title: The Markup (2026 follow-up)
  url: https://themarkup.org/artificial-intelligence/2026/01/30/mamdani-to-kill-the-nyc-ai-chatbot-we-caught-telling-businesses-to-break-the-law
