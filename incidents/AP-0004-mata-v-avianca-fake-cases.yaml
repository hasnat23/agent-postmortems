id: AP-0004
title: Lawyers sanctioned for filing ChatGPT-invented case law (Mata v. Avianca)
date: '2023-06-22'
system: ChatGPT
vendor: OpenAI
affected: Plaintiff's counsel, the court
classes: [hallucination]
severity: medium
status: in-the-wild
summary: >-
  Attorneys filed a brief citing six non-existent cases generated by ChatGPT, and when challenged, asked
  ChatGPT to confirm they were real. A federal judge fined them $5,000. It became the reference case for
  AI hallucinations in court filings.
root_cause: >-
  A chatbot was used as a legal research database, and its output was not checked against a real one.
mitigations:
- Verify every citation in a primary database; never ask the model to verify itself.
sources:
- title: Wikipedia
  url: https://en.wikipedia.org/wiki/Mata_v._Avianca,_Inc.
- title: LawSites
  url: https://www.lawnext.com/2023/06/court-imposes-sanctions-on-lawyers-who-filed-bogus-cases-after-relying-on-chatgpt-for-legal-research.html
