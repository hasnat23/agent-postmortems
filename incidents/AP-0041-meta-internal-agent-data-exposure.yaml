id: AP-0041
title: >-
  Meta engineer follows an internal AI agent's advice and exposes sensitive data for two hours
date: '2026-03-20'
system: Meta internal AI agent
vendor: Meta
affected: Meta users and internal data
classes: [hallucination, isolation-failure]
severity: high
status: in-the-wild
summary: >-
  An employee implemented flawed engineering guidance from an internal agent. The change made a large
  amount of sensitive user and company data visible to engineers who shouldn't have had access, for about
  two hours.
root_cause: >-
  Agent advice on access-control changes was applied without the review a human-authored change would
  get.
mitigations:
- >-
  Route agent-suggested changes to permissions and data access through normal security review.
sources:
- title: The Guardian
  url: https://www.theguardian.com/technology/2026/mar/20/meta-ai-agents-instruction-causes-large-sensitive-data-leak-to-employees
