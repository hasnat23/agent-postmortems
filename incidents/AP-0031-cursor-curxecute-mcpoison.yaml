id: AP-0031
title: Cursor runs attacker-edited MCP configs (CurXecute and MCPoison)
date: '2025-08'
system: Cursor IDE
vendor: Anysphere
affected: Cursor users before 1.3
classes: [prompt-injection, tool-poisoning, infra-vuln]
severity: high
status: research
summary: >-
  CurXecute (CVE-2025-54135): a prompt injection, for example a Slack message read via MCP, made the agent
  write a new entry into ~/.cursor/mcp.json, which Cursor started immediately, giving remote code execution.
  MCPoison (CVE-2025-54136): once a user approved a project MCP config, an attacker could swap its command
  in the repo and Cursor would run it without asking again.
root_cause: >-
  Config edits by the agent took effect without approval, and approval was bound to the server name, not
  to the command it runs.
mitigations:
- >-
  Require re-approval whenever an MCP config entry changes; bind approval to a hash of the command.
- Disallow the agent from writing its own tool configuration.
sources:
