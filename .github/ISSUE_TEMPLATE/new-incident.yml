name: New incident
description: Suggest a real AI agent or LLM failure to add
title: "Incident: "
labels: ["new-incident"]
body:
  - type: input
    id: what
    attributes:
      label: What happened?
      description: One sentence.
      placeholder: Coding agent deleted a production database while fixing a staging bug
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Public links, primary source first if there is one.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date disclosed
      placeholder: 2026-04 or 2026-04-27
  - type: textarea
    id: notes
    attributes:
      label: Root cause or anything else you know
